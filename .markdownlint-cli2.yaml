# Reference: https://github.com/DavidAnson/markdownlint-cli2#markdownlint-cli2yaml

config:
  ul-indent:
    # Kramdown wanted us to have 3 earlier, tho this CLI recommends 2 or 4
    indent: 3
  ol-prefix:
    style: "one"
  line-length:
    tables: false
    code_blocks: false

# Don't autofix anything, we're linting here
fix: false

# CLAUDE.md is just a link to AGENTS.md, not a standalone doc, so it fails
# markdownlint's heading/newline checks even though AGENTS.md itself passes
ignores:
- "CLAUDE.md"
